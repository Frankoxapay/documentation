      properties:
        destination:
          type: string
          description: Destination for the unsigned transactions. Business Logic says the owner defines
            the destination. This contract accepts it on the request and does not define a stored destination.
        candidateIds:
          type: array
          minItems: 1
          items:
            type: string
          description: Identifiers of candidates to include. The identifier space is not defined.
      description: Destination and candidate identifiers for unsigned Collect transactions.
    UnsignedTransaction:
      type: object
      required:
      - id
      - network
      - sourceAddress
      - destinationAddress
      - payload
      properties:
        id:
          type: string
          description: Unsigned transaction identifier.
        network:
          type: string
          description: Network identifier.
        sourceAddress:
          type: string
          description: Source address.
        destinationAddress:
          type: string
          description: Destination address.
        amount:
          type: string
          description: Transfer amount as a string. Unit is not defined.
        estimatedNetworkFee:
          type: string
          description: Estimated network fee as a string. Unit is not defined.
        payload:
          type: string
          description: Unsigned transaction payload as a string. Encoding is not defined.
      description: Unsigned transaction constructed for local signing.
    UnsignedTransactionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnsignedTransaction'
          description: Unsigned transactions.
      description: Unsigned Collect transactions.
    BroadcastTransactionsRequest:
      type: object
      required:
      - transactions
      properties:
        transactions:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - id
            - signedPayload
            properties:
              id:
                type: string
                description: Identifier of the unsigned transaction being submitted.
              signedPayload:
                type: string
                description: Signed transaction payload as a string. Encoding is not defined. Business
                  Logic says the Owner App signs locally.
          description: Signed transactions to broadcast. At least one item is required.
      description: Signed Collect transactions submitted for broadcast.
    BroadcastResult:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - id
            - status
            properties:
              id:
                type: string
                description: Transaction identifier.
              status:
                type: string
                description: Status string. No allowed values are defined. The HTTP status 202 means the
                  transactions were accepted for broadcast.
              transactionHash:
                type: string
                description: Transaction hash as a string. No format is defined.
          description: Per-transaction broadcast acceptance results.
      description: Acceptance result for signed Collect transactions.
    PaymentWebhookEvent:
      type: object
      required:
      - id
      - type
      - payment
      - createdAt
      properties:
        id:
          type: string
          description: Event identifier. The contract does not state whether this equals `payment.id`.
        type:
          type: string
          enum:
          - payment.detected
          - payment.confirmation_updated
          - payment.completed
          - payment.expired
          description: 'Event type: `payment.detected`, `payment.confirmation_updated`, `payment.completed`,
            or `payment.expired`. Mapping from type to `payment.status` is not defined.'
        payment:
          $ref: '#/components/schemas/Payment'
          description: Payment included in the event.
        createdAt:
          type: string
          format: date-time
          description: Event time as `date-time`.
      description: Payment lifecycle event delivered to the merchant.
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Error code. No catalog is defined.
        message:
          type: string
          description: Error message.
        details:
          type: object
          additionalProperties: true
          description: Additional object. Property meanings are not defined.
      description: Error object. No error-code catalog is defined.
      example:
        code: example_code
        message: Example message.
